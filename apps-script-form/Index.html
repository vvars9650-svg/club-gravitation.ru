<!doctype html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <?!= include_('Styles'); ?>
</head>
<body>
  <main class="app-shell">
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

    <nav class="tabs" id="tabs" aria-label="Разделы анкеты">
      <button type="button" class="tab is-active" data-step="0">Контактная информация</button>
      <button type="button" class="tab" data-step="1">Фотография</button>
      <button type="button" class="tab" data-step="2">О вас</button>
      <button type="button" class="tab" data-step="3">Знакомства</button>
      <button type="button" class="tab" data-step="4">Формат встреч</button>
      <button type="button" class="tab" data-step="5">Проверка</button>
    </nav>
    <div class="mobile-step" id="mobile-step">Контактная информация</div>

    <form id="application-form" novalidate>
      <section class="step is-active" data-step="0">
        <div class="grid">
          <label><span>Имя и фамилия *</span><input name="name" autocomplete="name" required></label>
          <label><span>Возраст *</span><select name="age" id="age" required><option value="">Выбрать возраст</option></select></label>
          <label><span>Пол *</span><select name="gender" required><option value="">Выбрать</option><option>Мужчина</option><option>Женщина</option><option>Предпочитаю обсудить лично</option></select></label>
          <label><span>Город *</span><select name="city" id="city" required><option value="">Выбрать город</option></select></label>
          <label id="city-visit-wrap" hidden><span>Сможете посещать встречи в Краснодаре? *</span><select name="city_visit" id="city-visit"><option value="">Выбрать</option><option>Да, регулярно</option><option>Да, время от времени</option><option>Пока не уверен(а)</option></select></label>
          <label><span>Телефон *</span><input name="phone" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 999 999-99-99" maxlength="16" required></label>
          <label><span>Telegram</span><input name="telegram" placeholder="@username"></label>
          <label><span>Email</span><input name="email" id="email" type="email" autocomplete="email" placeholder="name@example.ru"></label>
          <label><span>Как удобнее связаться?</span><select name="preferred_contact"><option value="">Выбрать</option><option>Telegram</option><option>Телефон</option><option>Email</option><option>WhatsApp</option></select></label>
        </div>
        <div class="actions actions-end"><button type="button" class="primary" data-next>ДАЛЕЕ</button></div>
      </section>

      <section class="step" data-step="1">
        <label class="dropzone" id="dropzone">
          <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
          <span class="photo-preview" id="photo-preview"><b>＋</b></span>
          <span class="photo-copy"><strong>Выбрать или перетащить фотографию</strong><small>JPG, PNG или WEBP. До 10 МБ.</small><small id="photo-name"></small></span>
        </label>
        <p class="field-error" id="photo-error" role="alert"></p>
        <div class="actions"><button type="button" class="back" data-back>← Назад</button><button type="button" class="primary" data-next>ДАЛЕЕ</button></div>
      </section>

      <section class="step" data-step="2">
        <label><span>Чем вы занимаетесь сейчас?</span><textarea name="occupation" rows="3"></textarea></label>
        <label><span>Чем наполнена ваша жизнь кроме работы?</span><textarea name="life_beyond_work" rows="3"></textarea></label>
        <label><span>Что вам интересно вне работы?</span><textarea name="interests" rows="3"></textarea></label>
        <label><span>Что вас зацепило в идее «Гравитации»?</span><textarea name="interest_reason" rows="4"></textarea></label>
        <label><span>Чего хотелось бы получить от первой встречи?</span><textarea name="expectations" rows="4"></textarea></label>
        <div class="actions"><button type="button" class="back" data-back>← Назад</button><button type="button" class="primary" data-next>ДАЛЕЕ</button></div>
      </section>

      <section class="step" data-step="3">
        <label><span>Как бы вы описали свой текущий контекст отношений?</span><select name="relationship_context"><option value="">Можно не отвечать</option><option>Свободен / свободна</option><option>В отношениях</option><option>Женат / замужем</option><option>В процессе изменений</option><option>Предпочитаю обсудить лично</option></select></label>
        <fieldset class="choice-group"><legend>Какие знакомства вам сейчас интересны?</legend>
          <label><input type="checkbox" name="connection_goal" value="Романтические отношения"><span>Романтические отношения</span></label>
          <label><input type="checkbox" name="connection_goal" value="Новые друзья"><span>Новые друзья</span></label>
          <label><input type="checkbox" name="connection_goal" value="Близкие по духу люди"><span>Близкие по духу люди</span></label>
          <label><input type="checkbox" name="connection_goal" value="Партнёрство / бизнес"><span>Партнёрство / бизнес</span></label>
          <label><input type="checkbox" name="connection_goal" value="Творческие и совместные проекты"><span>Творческие и совместные проекты</span></label>
          <label><input type="checkbox" name="connection_goal" value="Новый круг общения и впечатления"><span>Новый круг общения и впечатления</span></label>
          <label><input type="checkbox" name="connection_goal" value="Интересные люди без заданной цели"><span>Интересные люди без заданной цели</span></label>
        </fieldset>
        <label><span>Что вы особенно цените в людях?</span><textarea name="values_people" rows="3"></textarea></label>
        <label><span>Что обычно мешает вам знакомиться с новыми людьми?</span><textarea name="meeting_barriers" rows="3"></textarea></label>
        <div class="grid">
          <label><span>Комфорт в новой компании</span><select name="social_comfort"><option value="">Выбрать</option><option>1 — мне сложно</option><option>2</option><option>3 — нормально</option><option>4</option><option>5 — чувствую себя легко</option></select></label>
          <label><span>Легко ли первым начать разговор?</span><select name="initiative"><option value="">Выбрать</option><option>1 — почти никогда</option><option>2</option><option>3 — зависит от ситуации</option><option>4</option><option>5 — легко</option></select></label>
        </div>
        <label><span>Какой способ знакомства для вас наиболее естественный?</span><select name="introduction_scenario"><option value="">Выбрать</option><option>Через общее дело или занятие</option><option>Через живой разговор</option><option>Через игру или активность</option><option>Когда знакомят друзья</option><option>Когда первый шаг делает другой человек</option><option>Зависит от человека и ситуации</option></select></label>
        <div class="actions"><button type="button" class="back" data-back>← Назад</button><button type="button" class="primary" data-next>ДАЛЕЕ</button></div>
      </section>

      <section class="step" data-step="4">
        <label><span>Как для вас выглядит действительно удачный вечер в таком клубе?</span><textarea name="successful_evening" rows="3"></textarea></label>
        <label><span>Что должно произойти, чтобы захотелось прийти снова?</span><textarea name="return_reason" rows="3"></textarea></label>
        <label><span>Какое поведение других участников для вас неприемлемо?</span><textarea name="unacceptable_behavior" rows="3"></textarea></label>
        <fieldset class="choice-group"><legend>В какие дни вам обычно удобнее участвовать?</legend>
          <label><input type="checkbox" name="convenient_days" value="Будни"><span>Будни</span></label>
          <label><input type="checkbox" name="convenient_days" value="Пятница"><span>Пятница</span></label>
          <label><input type="checkbox" name="convenient_days" value="Суббота"><span>Суббота</span></label>
          <label><input type="checkbox" name="convenient_days" value="Воскресенье"><span>Воскресенье</span></label>
          <label><input type="checkbox" name="convenient_days" value="Зависит от мероприятия"><span>Зависит от мероприятия</span></label>
        </fieldset>
        <label><span>Какая стоимость участия в одной камерной встрече для вас комфортна?</span><select name="comfortable_price"><option value="">Выбрать</option><option>до 2 500 ₽</option><option>2 500–3 500 ₽</option><option>3 500–5 000 ₽</option><option>5 000–7 500 ₽</option><option>Стоимость зависит от формата</option></select></label>
        <label><span>Откуда узнали о нас?</span><select name="source"><option value="">Выбрать</option><option>Сайт / поиск</option><option>От знакомого / рекомендация</option><option>Telegram</option><option>Социальные сети</option><option>Сайт знакомств</option><option>Другое</option></select></label>
        <div class="actions"><button type="button" class="back" data-back>← Назад</button><button type="button" class="primary" data-next>ДАЛЕЕ</button></div>
      </section>

      <section class="step" data-step="5">
        <div class="review" id="review"></div>
        <label class="consent"><input type="checkbox" name="personal_data_consent" value="Да" required><span>Согласен(на) на обработку персональных данных и с <a href="https://club-gravitation.ru/privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a>.</span></label>
        <label class="consent"><input type="checkbox" name="rules_consent" value="Да" required><span>Понимаю, что заявка не гарантирует участие, и обязуюсь уважать личные границы других участников.</span></label>
        <input class="honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="page_url" id="page-url">
        <input type="hidden" name="referrer" id="referrer">
        <input type="hidden" name="user_agent" id="user-agent">
        <input type="hidden" name="submitted_at_client" id="submitted-at-client">
        <input type="hidden" name="utm_source" id="utm-source">
        <input type="hidden" name="utm_medium" id="utm-medium">
        <input type="hidden" name="utm_campaign" id="utm-campaign">
        <input type="hidden" name="utm_content" id="utm-content">
        <input type="hidden" name="utm_term" id="utm-term">
        <button class="submit" id="submit" type="submit">ОТПРАВИТЬ ЗАЯВКУ</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="actions final-actions"><button type="button" class="back" data-back>← Назад</button></div>
      </section>
    </form>

    <section class="success" id="success" hidden>
      <div class="success-icon">✓</div>
      <p class="eyebrow">ГРАВИТАЦИЯ</p>
      <h1>Ваша заявка отправлена</h1>
      <p>Спасибо. Мы познакомимся с ней и свяжемся с вами после короткого просмотра.</p>
      <small>ВАШ НОМЕР УЧАСТНИКА</small>
      <strong id="success-id"></strong>
      <p class="success-note">Сохраните этот номер.</p>
    </section>
  </main>

  <script>window.GRAVITATION_CITIES = <?!= citiesJson ?>; window.GRAVITATION_APP_VERSION = '<?= appVersion ?>';</script>
  <?!= include_('Script'); ?>
</body>
</html>
