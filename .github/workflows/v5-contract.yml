name: V5 contract
on:
  push:
    branches: [v5]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r backend/v5/requirements.txt
      - run: node --check assets/js/apply.js
      - run: node --check api/application.js
      - run: node --check tests/application-api.test.js
      - run: node --check tests/v5-contract.test.js
      - run: node --check tests/frontend-submit.test.js
      - run: node --check assets/js/admin.js
      - run: node --check assets/js/admin-auth.js
      - run: node --check tests/admin-ui.test.js
      - run: node tests/application-api.test.js
      - run: node tests/v5-contract.test.js
      - run: node tests/frontend-submit.test.js
      - run: node tests/admin-ui.test.js
      - run: python -m compileall backend/v5
      - run: python -m unittest discover -s backend/v5/tests -v
      - run: git diff --check
