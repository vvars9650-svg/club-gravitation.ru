name: Apps Script Form CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "apps-script-form/*.gs"
      - "apps-script-form/*.html"
      - "apps-script-form/appsscript.json"
      - "apps-script-form/.claspignore"
      - "apps-script-form/validate.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apps-script-form-production"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate form source
        run: node apps-script-form/validate.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Check Google credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "${CLASPRC_JSON}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured yet. Validation passed; Apps Script deployment is intentionally skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global @google/clasp@3.3.0

      - name: Restore clasp credentials
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          raw="$CLASPRC_JSON"
          if printf '%s' "$raw" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$raw" > "$HOME/.clasprc.json"
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ -n "$decoded" ]] && printf '%s' "$decoded" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$decoded" > "$HOME/.clasprc.json"
            else
              echo "::error::CLASPRC_JSON is neither valid JSON nor base64-encoded valid JSON. Replace the secret with: base64 -w0 ~/.clasprc.json"
              exit 1
            fi
          fi
          chmod 600 "$HOME/.clasprc.json"
          jq -e . "$HOME/.clasprc.json" >/dev/null
          clasp --version
          clasp show-authorized-user

      - name: Bootstrap Apps Script project
        if: steps.credentials.outputs.configured == 'true'
        id: bootstrap
        working-directory: apps-script-form
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .clasp.json ]]; then
            cp appsscript.json "$RUNNER_TEMP/gravitation-appsscript.json"
            clasp create --type standalone --title "Гравитация — анкета FORM" --rootDir .
            cp "$RUNNER_TEMP/gravitation-appsscript.json" appsscript.json
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          clasp status

      - name: Push source to Apps Script
        if: steps.credentials.outputs.configured == 'true'
        working-directory: apps-script-form
        run: clasp push --force

      - name: Create or update deployment
        if: steps.credentials.outputs.configured == 'true'
        id: deployment
        working-directory: apps-script-form
        shell: bash
        run: |
          set -euo pipefail
          description="GitHub ${GITHUB_SHA::7} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ -s .deployment-id ]]; then
            deployment_id="$(tr -d '\r\n ' < .deployment-id)"
            clasp deploy --deploymentId "$deployment_id" --description "$description" | tee "$RUNNER_TEMP/clasp-deploy.txt"
          else
            clasp deploy --description "$description" | tee "$RUNNER_TEMP/clasp-deploy.txt"
            deployment_id="$(grep -Eo 'AKfy[[:alnum:]_-]+' "$RUNNER_TEMP/clasp-deploy.txt" | head -n 1 || true)"
            [[ -n "$deployment_id" ]] || { echo "::error::Could not extract deployment ID"; exit 1; }
            printf '%s\n' "$deployment_id" > .deployment-id
          fi
          webapp_url="https://script.google.com/macros/s/${deployment_id}/exec"
          printf '%s\n' "$webapp_url" > .webapp-url
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "webapp_url=$webapp_url" >> "$GITHUB_OUTPUT"

      - name: Attempt WebAppConfig via Apps Script API
        if: steps.credentials.outputs.configured == 'true'
        working-directory: apps-script-form
        shell: bash
        run: |
          set -euo pipefail
          script_id="$(jq -r '.scriptId' .clasp.json)"
          deployment_id="$(tr -d '\r\n ' < .deployment-id)"
          access_token="$(jq -r '.tokens.default.access_token // .access_token // .token.access_token // empty' "$HOME/.clasprc.json")"
          [[ -n "$access_token" ]] || { echo "::error::No access token found in clasp credentials"; exit 1; }

          curl -fsS -H "Authorization: Bearer $access_token" \
            "https://script.googleapis.com/v1/projects/${script_id}/deployments/${deployment_id}" \
            -o "$RUNNER_TEMP/deployment-before.json"
          echo "Deployment before WebAppConfig attempt:"
          jq '{deploymentId,deploymentConfig,entryPoints}' "$RUNNER_TEMP/deployment-before.json"

          version="$(jq -r '.deploymentConfig.versionNumber' "$RUNNER_TEMP/deployment-before.json")"
          description="GitHub ${GITHUB_SHA::7} webapp"
          jq -n --argjson version "$version" --arg description "$description" '{
            deploymentConfig:{versionNumber:$version,manifestFileName:"appsscript",description:$description},
            entryPoints:[{entryPointType:"WEB_APP",webApp:{entryPointConfig:{access:"ANYONE_ANONYMOUS",executeAs:"USER_DEPLOYING"}}}]
          }' > "$RUNNER_TEMP/webapp-update.json"

          http_code="$(curl -sS -o "$RUNNER_TEMP/webapp-update-response.json" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/webapp-update.json" \
            "https://script.googleapis.com/v1/projects/${script_id}/deployments/${deployment_id}")"
          echo "Apps Script API WebAppConfig HTTP $http_code"
          cat "$RUNNER_TEMP/webapp-update-response.json" | jq . || cat "$RUNNER_TEMP/webapp-update-response.json"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "::error::Apps Script API did not accept WebAppConfig on deployment update."
            exit 1
          fi

      - name: Persist Apps Script metadata
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add apps-script-form/.clasp.json apps-script-form/.deployment-id apps-script-form/.webapp-url
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist Apps Script deployment metadata [skip ci]"
          git push origin HEAD:main

      - name: Smoke-test deployed form
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deployment.outputs.webapp_url }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/form-smoke.html"
          ok=0
          for attempt in $(seq 1 12); do
            echo "Smoke test attempt $attempt/12"
            http_code="$(curl -L -sS --max-time 30 -o "$body_file" -w '%{http_code}' "$WEBAPP_URL?ci=${GITHUB_SHA}" || true)"
            echo "HTTP $http_code"
            if [[ "$http_code" == "200" ]] && grep -q 'id="application-form"' "$body_file"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Published Apps Script form did not return expected HTML."
            sed -n '1,80p' "$body_file" || true
            exit 1
          fi
          echo "Apps Script web app smoke test passed: $WEBAPP_URL"
