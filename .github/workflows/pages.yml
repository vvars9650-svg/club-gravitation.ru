name: Deploy V2 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build responsive hero assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/hero
          cat .hero-build-v2/desktop/part*.b64 | base64 --decode > assets/images/hero/hero-desktop.webp
          cat .hero-build-v2/tablet-landscape/part*.b64 | base64 --decode > assets/images/hero/hero-tablet-landscape.webp
          cat .hero-build-v2/tablet-portrait/part*.b64 | base64 --decode > assets/images/hero/hero-tablet-portrait.webp
          cat .hero-build-v2/mobile/part*.b64 | base64 --decode > assets/images/hero/hero-mobile.webp
          printf '%s  %s\n' \
            'c2f749748263feef56484279a71bbc00aeb2176729aec358e7425c04454576f4' 'assets/images/hero/hero-desktop.webp' \
            '06cb429fbd105da7deb8feb642b0701b31bdd5ad3e044d25176097411177bac0' 'assets/images/hero/hero-tablet-landscape.webp' \
            'f8bd0ace1775eca5cbb9c0a30c7f1923fefca7ec31b8963af02de01c63f27b93' 'assets/images/hero/hero-tablet-portrait.webp' \
            'f1e9735129a87fc9b471207d73d996815c8a383081c85bd1f9d9fc6ace75c302' 'assets/images/hero/hero-mobile.webp' | sha256sum -c -

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    name: Responsive QA
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live-site responsive tests
        env:
          BASE_URL: https://club-gravitation.ru
        run: npx playwright test tests/e2e.spec.js --reporter=line
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
