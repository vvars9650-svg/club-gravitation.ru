name: Keep Apps Script in Participants Folder

on:
  push:
    branches: ["main"]
    paths:
      - "apps-script-form/**"
      - ".github/workflows/apps-script-drive-location.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move-project:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      DESTINATION_FOLDER_ID: 1uw6SCPj2XwJyLUHcF0OqO2mnjEwpQlEe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Restore clasp credentials
        shell: bash
        run: |
          set -euo pipefail
          raw="$CLASPRC_JSON"
          if printf '%s' "$raw" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$raw" > "$HOME/.clasprc.json"
          else
            printf '%s' "$raw" | base64 --decode > "$HOME/.clasprc.json"
          fi
          chmod 600 "$HOME/.clasprc.json"
          jq -e . "$HOME/.clasprc.json" >/dev/null
          clasp show-authorized-user >/dev/null

      - name: Move Apps Script project in Google Drive
        shell: bash
        run: |
          set -euo pipefail
          script_id="$(jq -r '.scriptId' apps-script-form/.clasp.json)"
          token="$(jq -r '.tokens.default.access_token // .access_token // .token.access_token // empty' "$HOME/.clasprc.json")"
          [[ -n "$script_id" && "$script_id" != "null" ]] || { echo "::error::Missing scriptId"; exit 1; }
          [[ -n "$token" ]] || { echo "::error::Missing access token"; exit 1; }

          curl -fsS -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/drive/v3/files/${script_id}?fields=id,name,parents&supportsAllDrives=true" \
            -o "$RUNNER_TEMP/script-file.json"
          cat "$RUNNER_TEMP/script-file.json"

          if jq -e --arg dest "$DESTINATION_FOLDER_ID" '.parents[]? == $dest' "$RUNNER_TEMP/script-file.json" >/dev/null; then
            echo "Apps Script project is already in the participants folder."
            exit 0
          fi

          current_parents="$(jq -r '.parents // [] | join(",")' "$RUNNER_TEMP/script-file.json")"
          query="addParents=${DESTINATION_FOLDER_ID}&fields=id,name,parents&supportsAllDrives=true"
          if [[ -n "$current_parents" ]]; then query="${query}&removeParents=${current_parents}"; fi

          curl -fsS -X PATCH -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/drive/v3/files/${script_id}?${query}" \
            -o "$RUNNER_TEMP/moved-script.json"
          cat "$RUNNER_TEMP/moved-script.json"
          jq -e --arg dest "$DESTINATION_FOLDER_ID" '.parents[]? == $dest' "$RUNNER_TEMP/moved-script.json" >/dev/null \
            || { echo "::error::Apps Script project was not moved to 5. Участники"; exit 1; }
