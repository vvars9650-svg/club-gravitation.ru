<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ГРАВИТАЦИЯ — Admin TEST</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell" id="admin-app">
    <header class="admin-header"><div><p class="eyebrow eyebrow--gold">ЗАКРЫТЫЙ ИНТЕРФЕЙС</p><h1>ГРАВИТАЦИЯ <span>ADMIN</span></h1></div><strong class="env-badge">TEST</strong></header>
    <section class="admin-controls" aria-label="Фильтры заявок">
      <input id="admin-search" type="search" placeholder="Поиск: имя, телефон, Telegram, город">
      <select id="admin-status"><option value="">Все статусы</option></select>
      <input id="admin-owner" placeholder="Ответственный">
      <select id="admin-priority"><option value="">Любой приоритет</option><option>Высокий</option><option>Средний</option><option>Низкий</option></select>
      <select id="admin-sort"><option value="submitted_at:desc">Сначала новые</option><option value="submitted_at:asc">Сначала старые</option><option value="full_name:asc">Имя А–Я</option><option value="priority:asc">Приоритет</option></select>
    </section>
    <p class="admin-state" id="admin-state" aria-live="polite">Загрузка заявок…</p>
    <div class="admin-table-wrap"><table><thead><tr><th>Дата заявки</th><th>Имя</th><th>Возраст</th><th>Город</th><th>Телефон</th><th>Telegram</th><th>Связь</th><th>Статус</th><th>Ответственный</th><th>Приоритет</th><th>Следующее действие</th><th>Контакт</th><th>Решение</th></tr></thead><tbody id="admin-list"></tbody></table></div>
    <aside class="participant-drawer" id="participant-drawer" hidden aria-label="Карточка участника"><button id="drawer-close" type="button">Закрыть</button><div id="participant-card"></div></aside>
  </main>
  <script src="/assets/js/admin.js" defer></script>
</body>
</html>
