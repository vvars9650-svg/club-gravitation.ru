<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ГРАВИТАЦИЯ — Панель заявок</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell" id="admin-app">
    <header class="admin-header"><div><p class="eyebrow eyebrow--gold">ЗАКРЫТЫЙ РАЗДЕЛ</p><h1>ГРАВИТАЦИЯ <span>ЗАЯВКИ</span></h1></div></header>
    <section class="admin-auth" id="admin-auth" aria-live="polite">
      <p data-auth-state>Проверяем доступ…</p>
      <button class="admin-login" id="admin-login" type="button">ВОЙТИ</button>
    </section>
    <section id="admin-workspace" hidden>
    <div class="admin-session"><span id="admin-identity"></span><button id="admin-logout" type="button">Выйти</button></div>
    <section class="admin-controls" aria-label="Фильтры заявок">
    <input id="admin-search" type="search" placeholder="Поиск: имя, телефон, профиль или мессенджер, город">
      <select id="admin-status"><option value="">Все статусы</option></select>
      <select id="admin-owner"><option value="">Все ответственные</option></select>
      <select id="admin-priority"><option value="">Любой приоритет</option><option>Высокий</option><option>Средний</option><option>Низкий</option></select>
      <select id="admin-sort"><option value="submitted_at:desc">Сначала новые</option><option value="submitted_at:asc">Сначала старые</option><option value="full_name:asc">Имя А–Я</option><option value="priority:asc">Приоритет</option></select>
    </section>
    <p class="admin-state" id="admin-state" aria-live="polite">Загрузка заявок…</p>
    <div class="admin-table-wrap"><table><thead><tr><th>№</th><th>Дата заявки</th><th>Имя</th><th>Возраст</th><th>Город</th><th>Телефон</th><th>Профиль или мессенджер</th><th>Связь</th><th>Статус</th><th>Ответственный</th><th>Приоритет</th><th>Следующее действие</th><th>Контакт</th><th>Решение</th></tr></thead><tbody id="admin-list"></tbody></table></div>
    <aside class="participant-drawer" id="participant-drawer" hidden aria-label="Карточка заявки"><header class="card-header"><div><span id="card-application-number"></span><h2 id="card-applicant-name"></h2></div><button id="drawer-close" type="button">Закрыть</button></header><div id="participant-card"></div></aside>
    </section>
  </main>
  <script src="/assets/js/admin-config.test.js" defer></script>
  <script src="/assets/js/admin-auth.js" defer></script>
  <script src="/assets/js/admin.js" defer></script>
</body>
</html>
